
name: Build PT-iOS IPA

on:
  push:
    branches:
      - 'fix/ios-a15-a16'
  workflow_dispatch:
    inputs:
      runner:
        description: macOS hosted runner to use for the iOS cross-build
        required: true
        type: choice
        default: macos-15-intel
        options:
          - macos-15-intel
          - macos-26-intel
          - macos-15

# Keep one current build and at most one pending build. Do not cancel a
# runner-acquisition attempt just because another manual dispatch was clicked.
concurrency:
  group: ios-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 75

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          sw_vers
          brew --prefix
          xcodebuild -version
          cmake --version
          ninja --version
          df -h /

      - name: Cache iOS dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/ios-device/_deps
            build/vendor/MoltenVK-ios.tar
          key: ios-deps-${{ inputs.runner || 'macos-15-intel' }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/IOS.cmake', 'script/build_ios.sh') }}
          restore-keys: |
            ios-deps-${{ inputs.runner || 'macos-15-intel' }}-

      - name: Install dependencies
        run: |
          set -euxo pipefail
          brew install bash cmake ninja vulkan-headers shaderc vulkan-loader

      - name: Verify Vulkan tools
        run: |
          set -euxo pipefail
          BREW_PREFIX="$(brew --prefix)"
          test -f "$BREW_PREFIX/include/vulkan/vulkan.h"
          test -f "$BREW_PREFIX/lib/libvulkan.dylib"
          test -x "$BREW_PREFIX/bin/glslc"
          echo "Using Homebrew at $BREW_PREFIX"

      - name: Compile PT-iOS
        id: compile
        shell: bash
        run: |
          set -euxo pipefail
          bash -x ./script/build_ios.sh 2>&1 | tee "$RUNNER_TEMP/pt-ios-build.log"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PT-iOS-unsigned
          path: dist/PT-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PT-iOS-build-log
          path: ${{ runner.temp }}/pt-ios-build.log
          if-no-files-found: warn
          retention-days: 7
