
name: Build PT-iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check build environment
        run: |
          uname -m
          xcodebuild -version
          xcode-select -p

      - name: Install dependencies
        run: |
          brew install cmake ninja vulkan-headers shaderc vulkan-loader

      - name: Compile PT-iOS
        run: |
          ./script/build_ios.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PT-iOS-unsigned
          path: dist/PT-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
